name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "${RELEASE_TAG#v}" != "${RELEASE_TAG}"
          test "${RELEASE_TAG}" = "v$(node -p "require('./package.json').version")"
          node -e 'const fs=require("fs"); const cargo=fs.readFileSync("src-tauri/Cargo.toml","utf8"); const cargoLock=fs.readFileSync("src-tauri/Cargo.lock","utf8"); const lock=require("./package-lock.json"); const tauri=require("./src-tauri/tauri.conf.json"); const pkg=require("./package.json"); const root=lock.packages?.[""]; if (root?.name !== pkg.name || root?.version !== pkg.version || !cargo.includes(`version = "${pkg.version}"`) || !cargoLock.includes(`name = "agent-taskboard-launcher"\nversion = "${pkg.version}"`) || tauri.version !== pkg.version) process.exit(1)'
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish source-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk '/^## \[2\.0\.0\]/{found=1} found && /^## / && !/^## \[2\.0\.0\]/{exit} found{print}' CHANGELOG.md > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "Agent Taskboard ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
