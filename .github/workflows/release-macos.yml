name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "${RELEASE_TAG#v}" != "${RELEASE_TAG}"
          test "${RELEASE_TAG}" = "v$(node -p "require('./package.json').version")"
          node -e 'const fs=require("fs"); const cargo=fs.readFileSync("src-tauri/Cargo.toml","utf8"); const tauri=require("./src-tauri/tauri.conf.json"); const pkg=require("./package.json"); if (!cargo.includes(`version = "${pkg.version}"`) || tauri.version !== pkg.version) process.exit(1)'
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with: { targets: x86_64-unknown-linux-gnu }
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential file libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget
      - run: npm ci
      - run: npm run app:build:linux:x64
      - name: Stage stable Linux assets and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb release/Agent.Taskboard_${{ github.ref_name }}_Ubuntu-24.04-x64.deb
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage release/Agent.Taskboard_${{ github.ref_name }}_Ubuntu-24.04-x64.AppImage
          (cd release && shasum -a 256 * > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: linux-stable, path: release/ }

  build-windows-preview:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with: { targets: x86_64-pc-windows-msvc }
      - run: npm ci
      - run: npm run app:build:windows
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: windows-preview, path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe }

  publish:
    needs: [build-linux, build-windows-preview]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with: { path: release-assets, merge-multiple: true }
      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Agent Taskboard ${{ github.ref_name }}

          Linux x64 packages are the stable target. Windows x64 is an unsigned preview. macOS is not published by this workflow until a Developer ID certificate is configured. SHA256 checksums are included in `SHA256SUMS`.

          Agent Taskboard is independent and not affiliated with or endorsed by OpenAI.
          EOF
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --title "Agent Taskboard ${{ github.ref_name }}" --notes-file release-notes.md --verify-tag
